# .github/workflows/pages-retry.yml: retry a failed Pages deploy, then fail loudly.
# GitHub's own "pages build and deployment" run (legacy build) gives up after
# one 10-minute deploy timeout and nothing re-runs it: episode 53's deploy
# timed out at syncing_files and the episode went out about 23 h late with no
# alert. This re-runs the failed jobs up to MAX_ATTEMPTS in all, and if the
# deploy still fails, this run fails with an error, which GitHub reports
# through its usual failed-workflow notification.
#
# No concurrency block: each failed deploy run has its own id, and the
# re-runs' own completion events are skipped by the job's `if`, so a group
# keyed on the run id would only queue those skipped runs behind this one.
name: pages-retry
on:
  workflow_run:
    # The workflow's name; its runs are titled "pages build and deployment".
    workflows: [pages-build-deployment]
    types: [completed]
permissions:
  actions: write
  contents: read

jobs:
  retry:
    # Only the first attempt: the re-runs below are watched by this same job.
    # A cancelled deploy was stopped on purpose or superseded: left alone.
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      MAX_ATTEMPTS: 3
    steps:
      - name: Re-run the failed deploy, at most MAX_ATTEMPTS in all
        run: |
          attempt=1
          while [ "$attempt" -lt "$MAX_ATTEMPTS" ]; do
            sleep 60
            # A newer push has its own deploy, which carries this commit too;
            # re-running this one would put the older site back. Checked after
            # the wait, so a push during it counts.
            tip=$(gh api "repos/$GH_REPO/branches/$BRANCH" --jq .commit.sha)
            if [ "$tip" != "$HEAD_SHA" ]; then
              echo "::notice::$BRANCH moved to $tip; its own deploy supersedes $HEAD_SHA."
              exit 0
            fi
            gh run rerun "$RUN_ID" --failed
            attempt=$((attempt + 1))
            echo "Re-running $RUN_URL (attempt $attempt of $MAX_ATTEMPTS)"
            while :; do
              sleep 30
              state=$(gh run view "$RUN_ID" --json attempt,status,conclusion \
                --jq '"\(.attempt) \(.status) \(.conclusion)"')
              read -r seen status conclusion <<< "$state"
              if [ "$seen" -eq "$attempt" ] && [ "$status" = completed ]; then
                break
              fi
            done
            # failure and timed_out are retried; cancelled is left alone.
            case $conclusion in
              success)
                echo "::notice::Pages deploy for $HEAD_SHA succeeded on attempt $attempt."
                exit 0 ;;
              cancelled)
                echo "::notice::Attempt $attempt was cancelled, by hand or by a newer deploy; stopping."
                exit 0 ;;
            esac
          done
          msg="Pages deploy for $HEAD_SHA failed $MAX_ATTEMPTS times, so that push is not live. $RUN_URL"
          echo "::error title=Pages deploy failed::$msg"
          echo "**Pages deploy failed:** $msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1
